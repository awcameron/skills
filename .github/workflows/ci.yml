name: CI

on:
  pull_request:
    paths:
      - "skills/**"
      - "evals/**"
      - "plugin-evals/**"
      - "scripts/**"
      - "schemas/**"
      - ".claude-plugin/**"
      - ".gemini/commands/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - "**/*.md"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "evals/**"
      - "plugin-evals/**"
      - "scripts/**"
      - "schemas/**"
      - ".claude-plugin/**"
      - ".gemini/commands/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - "**/*.md"

permissions:
  contents: read

jobs:
  validate-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate skill frontmatter
        run: npm run validate

      - name: Run script unit tests
        run: npm test

      - name: Run trigger-routing evals
        run: npm run eval
