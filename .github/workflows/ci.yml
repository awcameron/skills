name: CI

on:
  pull_request:
    paths:
      - "skills/**"
      - "evals/**"
      - "plugin-evals/**"
      - "scripts/**"
      - "schemas/**"
      - ".claude-plugin/**"
      - ".gemini/commands/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - "**/*.md"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "evals/**"
      - "plugin-evals/**"
      - "scripts/**"
      - "schemas/**"
      - ".claude-plugin/**"
      - ".gemini/commands/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - "**/*.md"

permissions:
  contents: read

jobs:
  validate-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: package.json
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate skill frontmatter
        run: npm run validate

      - name: Run script unit tests
        run: npm test

      - name: Run trigger-routing evals
        run: npm run eval
