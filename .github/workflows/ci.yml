name: CI

on:
  pull_request:
    paths:
      - "skills/**"
      - "evals/**"
      - "scripts/**"
      - "package.json"
      - "**/*.md"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "evals/**"
      - "scripts/**"
      - "package.json"
      - "**/*.md"

jobs:
  validate-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json

      - name: Validate skill frontmatter
        run: npm run validate

      - name: Run trigger-routing evals
        run: npm run eval
