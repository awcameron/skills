# Keeps the commit-SHA pins in .github/workflows/ current, and the npm dependencies the scripts use
# (ajv, js-yaml). Actions are pinned to a full SHA (with the version in a trailing comment) so a
# moved tag can't change what our workflows run.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ["*"]
